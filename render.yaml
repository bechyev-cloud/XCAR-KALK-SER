# Render Blueprint — разворачивает сервер XCAR СРАЗУ с постоянным диском,
# чтобы данные (машины, история, аккаунты, push-подписки) НИКОГДА не
# стирались при передеплое или перезапуске контейнера.
#
# Как использовать:
#   1. Залейте содержимое папки xcar-server (вместе с этим файлом) в git-репозиторий.
#   2. На Render: New → Blueprint → укажите этот репозиторий.
#   3. Render сам создаст веб-сервис и подключит к нему постоянный диск —
#      руками ничего добавлять не нужно, данные сразу под защитой.
#
# Важно: постоянный диск (persistent disk) на Render доступен только на
# платных тарифах — на бесплатном (Free) диски подключить нельзя в принципе,
# и любые данные там стираются при каждом передеплое. Тариф "0.5c-512mb" —
# самый дешёвый платный вариант, этого с большим запасом достаточно для
# этого приложения (см. актуальные цены на render.com/pricing).

services:
  - type: web
    name: xcar-server
    runtime: node
    plan: 0.5c-512mb
    buildCommand: ""
    startCommand: node server.js
    disk:
      name: xcar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: XCAR_DB_PATH
        value: /data/xcar.db.json
      - key: XCAR_ALLOWED_ORIGIN
        value: "*"
